name: Build and release package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1). Creates tag vX.Y and the GitHub release. Leave empty for a test build without release.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ -n "${INPUT_VERSION}" ]; then
            ref="v${INPUT_VERSION}"
            echo "tag=v${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          case "$ref" in
            v[0-9]*) ver="${ref#v}" ;;
            [0-9]*) ver="$ref" ;;
            *) ver="$(sed -n 's/^PLUGIN_VERSION=[[:space:]]*//p' plugin/Makefile)" ;;
          esac
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "Invalid version '$ver'" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build package in FreeBSD with OPNsense plugin tooling
        uses: vmactions/freebsd-vm@v1
        env:
          PLUGIN_VER: ${{ steps.version.outputs.version }}
        with:
          release: "14.3"
          usesh: true
          envs: PLUGIN_VER
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            env ASSUME_ALWAYS_YES=yes pkg install -y git-lite
          run: |
            set -e
            WS="$(pwd)"
            git clone --depth 1 https://github.com/opnsense/plugins.git /tmp/opnsense-plugins
            mkdir -p /tmp/opnsense-plugins/net/fritzbox-failover
            cp -R plugin/Makefile plugin/pkg-descr plugin/src /tmp/opnsense-plugins/net/fritzbox-failover/
            cd /tmp/opnsense-plugins/net/fritzbox-failover
            sed -i '' "s/^PLUGIN_VERSION=.*/PLUGIN_VERSION=		${PLUGIN_VER}/" Makefile
            make package
            mkdir -p "$WS/dist"
            cp work/pkg/os-fritzbox-failover-*.pkg "$WS/dist/"
            cp work/pkg/os-fritzbox-failover-*.pkg "$WS/dist/os-fritzbox-failover.pkg"
            pkg info -F "$WS/dist/os-fritzbox-failover.pkg"
            ls -l "$WS/dist"

      - name: Verify package
        run: |
          ls -l dist
          test -s dist/os-fritzbox-failover.pkg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-fritzbox-failover
          path: dist/*.pkg

      - name: Publish release assets
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: os-fritzbox-failover ${{ steps.version.outputs.version }}
          files: dist/*.pkg
          fail_on_unmatched_files: true
