name: Build and release package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1). Creates tag vX.Y and the GitHub release. Leave empty for a test build without release.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: plugin

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ -n "${INPUT_VERSION}" ]; then
            ref="v${INPUT_VERSION}"
            echo "tag=v${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          case "$ref" in
            v[0-9]*) ver="${ref#v}" ;;
            [0-9]*) ver="$ref" ;;
            *) ver="$(sed -n 's/^PLUGIN_VERSION=[[:space:]]*//p' plugin/Makefile)" ;;
          esac
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "Invalid version '$ver'" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build package in FreeBSD with OPNsense plugin tooling
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        env:
          PLUGIN_VER: ${{ steps.version.outputs.version }}
          PLUGINS_TAG: '26.1.11'
          PLUGINS_COMMIT: '8ad4779754022fadb7fa32e7dd6b0e6cb16fc58c'
        with:
          release: "14.3"
          usesh: true
          envs: 'PLUGIN_VER PLUGINS_TAG PLUGINS_COMMIT'
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            env ASSUME_ALWAYS_YES=yes pkg install -y git-lite
          run: |
            set -e
            WS="$(pwd)"
            # pinned OPNsense plugin build system (bump deliberately for new OPNsense releases)
            git clone --depth 1 --branch "${PLUGINS_TAG}" https://github.com/opnsense/plugins.git /tmp/opnsense-plugins
            test "$(git -C /tmp/opnsense-plugins rev-parse HEAD)" = "${PLUGINS_COMMIT}"
            # development branches mark every package as "-devel"; release builds must not
            rm -f /tmp/opnsense-plugins/Mk/devel.mk
            mkdir -p /tmp/opnsense-plugins/net/fritzbox-failover
            cp -R plugin/Makefile plugin/pkg-descr plugin/src plugin/+*.pre plugin/+*.post /tmp/opnsense-plugins/net/fritzbox-failover/
            cd /tmp/opnsense-plugins/net/fritzbox-failover
            sed -i '' "s/^PLUGIN_VERSION=.*/PLUGIN_VERSION=		${PLUGIN_VER}/" Makefile
            make package
            mkdir -p "$WS/dist"
            PKGFILE="work/pkg/os-fritzbox-failover-${PLUGIN_VER}.pkg"
            test -f "$PKGFILE" || { echo "expected $PKGFILE, got:"; ls work/pkg; exit 1; }
            test "$(pkg query -F "$PKGFILE" '%n')" = "os-fritzbox-failover"
            cp "$PKGFILE" "$WS/dist/"
            cp "$PKGFILE" "$WS/dist/os-fritzbox-failover.pkg"
            pkg info -F "$WS/dist/os-fritzbox-failover.pkg"
            tar -xOf "$WS/dist/os-fritzbox-failover.pkg" +MANIFEST | grep -q 'pre-deinstall'
            tar -xOf "$WS/dist/os-fritzbox-failover.pkg" +MANIFEST | grep -q 'post-deinstall'
            ls -l "$WS/dist"

      - name: Verify package
        run: |
          ls -l dist
          test -s dist/os-fritzbox-failover.pkg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os-fritzbox-failover
          path: dist/*.pkg

      - name: Publish release assets
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: os-fritzbox-failover ${{ steps.version.outputs.version }}
          body: |
            FRITZ!Box Cable WAN failover plugin for OPNsense, version ${{ steps.version.outputs.version }}.

            **Install / update** (SSH on the OPNsense, menu option 8 "Shell"):
            ```sh
            curl -fL --retry 3 --connect-timeout 15 --progress-bar -o /tmp/os-fritzbox-failover.pkg https://github.com/${{ github.repository }}/releases/latest/download/os-fritzbox-failover.pkg && env IGNORE_OSVERSION=yes pkg add -f /tmp/os-fritzbox-failover.pkg && rm -f /tmp/os-fritzbox-failover.pkg
            ```
            See the README for setup and the test mode.
          files: dist/*.pkg
          fail_on_unmatched_files: true
