[start]
command:/usr/local/etc/rc.d/fritzfailover start
parameters:
type:script
message:starting FRITZ!Box failover monitor

[stop]
command:/usr/local/etc/rc.d/fritzfailover stop
parameters:
type:script
message:stopping FRITZ!Box failover monitor

[restart]
command:/usr/local/etc/rc.d/fritzfailover restart
parameters:
type:script
message:restarting FRITZ!Box failover monitor

[status]
command:/usr/local/etc/rc.d/fritzfailover status; exit 0
parameters:
type:script_output
message:requesting FRITZ!Box failover monitor status

[state]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh state
parameters:
type:script_output
message:requesting FRITZ!Box failover state

[test]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh test
parameters:
type:script_output
message:testing FRITZ!Box failover connectivity

[check]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh check
parameters:
type:script
message:running single FRITZ!Box failover check

[restore]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh restore
parameters:
type:script
message:restoring normal gateway monitor IP

[resetstats]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh resetstats
parameters:
type:script
message:resetting FRITZ!Box failover test statistics

[testfailover]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh testfailover
parameters:
type:script_output
message:starting FRITZ!Box test failover

[gateways]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzfailover_helper.php gwlist
parameters:
type:script_output
message:listing gateways for FRITZ!Box failover

[cfcheck]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzfailover_helper.php cfcheck
parameters:
type:script_output
message:checking FRITZ!Box failover Cloudflare record

[pushtest]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzfailover_helper.php pushtest
parameters:
type:script_output
message:sending FRITZ!Box failover test notification

[debug.start]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh debug start
parameters:
type:script
message:starting FRITZ!Box failover debug mode

[debug.stop]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh debug stop
parameters:
type:script
message:stopping FRITZ!Box failover debug mode

[debug.clear]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh debug clear
parameters:
type:script
message:clearing FRITZ!Box failover debug log

[debug.status]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh debug status
parameters:
type:script_output
message:FRITZ!Box failover debug status

[debug.log]
command:/usr/local/opnsense/scripts/OPNsense/FritzFailover/fritzbox_failover.sh debug log
parameters:
type:script_output
message:reading FRITZ!Box failover debug log
